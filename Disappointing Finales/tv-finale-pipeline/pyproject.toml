[project]
name = "tv-finale-pipeline"
version = "0.1.0"
description = "Data pipeline for TV-series finale research"
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
  "pandas>=2.0",
  "pyarrow>=12.0",
  "requests>=2.31",
  "rapidfuzz>=3.5",
  "tqdm>=4.66",
  "google-cloud-bigquery>=3.17"
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = "-q"
